name: Deploy - Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm install
    
    - name: Verify dependencies
      run: |
        echo "Verifying dependencies..."
        npm list --depth=0
        node --version
    
    - name: Deploy to production
      env:
        DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      run: |
        echo "Deployment would happen here"
        echo "Configure DEPLOY_KEY, DEPLOY_HOST, DEPLOY_USER secrets in GitHub"
    
    - name: Health check
      run: |
        echo "✅ Deployment complete"
        echo "Next step: SSH to server and restart service"
        echo "Command: ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} 'cd veg-waste-reduction && npm start'"

  notification:
    needs: deploy
    runs-on: ubuntu-latest
    if: always()
    steps:
    - name: Deploy notification
      run: |
        if [ "${{ needs.deploy.result }}" == "success" ]; then
          echo "✅ Deployment successful"
        else
          echo "❌ Deployment failed"
        fi
