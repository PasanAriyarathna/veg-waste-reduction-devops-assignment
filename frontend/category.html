<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories - VegWaste</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <span class="emoji">🥬</span>
                <span class="text">VegWaste Sri Lanka</span>
            </div>
            <div class="nav-menu">
                <a href="index.html" class="nav-link">Home</a>
                <a href="signin.html" class="nav-link">Sign In</a>
                <a href="category.html" class="nav-link active">Categories</a>
                <button class="nav-link btn-logout" onclick="logout()">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <h1>🥬 Vegetable Categories</h1>
            <p id="userGreeting">Welcome back!</p>
        </div>

        <!-- Recent Updates Section for Agents -->
        <div id="recentUpdatesSection" style="display: none; margin-bottom: 40px;">
            <h2 style="color: #2c3e50; margin-bottom: 20px;">📝 Your Recent Updates</h2>
            <div id="recentUpdatesContainer" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px;">
                <!-- Recent updates will be loaded here -->
            </div>
        </div>

        <div id="vegetablesCategoriesContainer" class="vegetables-grid">
            <!-- Vegetables will be loaded here by JavaScript -->
        </div>
    </div>

    <script src="category.js"></script>
</body>
</html>
